<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jadual 222 kerusi Parlemen PRU16 — semak, susun, dan tapis.">
  <title>Jadual Kerusi — Hitung Kerusi 222</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" href="/assets/favicon-hk222.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="seats federal">
  <!-- THESIS: Every headline must lead to a searchable seat-level record. OWN-WORLD: Civic wayfinding in ink and paper. STORY: find a constituency, filter its context, and inspect the forecast. FIRST VIEWPORT: a direct title and command bar lead into the national seat list. FORM: Civic wayfinding board, seed fe6a62ce. FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md -->
  <div id="topbar-root"></div>

  <main>
    <section class="section">
      <div class="container">
        <h1 class="display-1">Jadual <span>Kerusi</span></h1>
        <p class="muted">222 kerusi Parlimen — semak dan tapis berdasarkan negeri, gabungan atau parti.</p>

        <div class="seats-controls">
          <input type="text" id="seat-search" placeholder="Cari kerusi atau calon..." style="padding: 8px 12px; border-radius: var(--border-radius-sm); border: 1px solid var(--line); background: var(--panel); color: var(--body-text); width: 240px;">
          <select id="seat-filter-state" style="padding: 8px 12px; border-radius: var(--border-radius-sm); border: 1px solid var(--line); background: var(--panel); color: var(--body-text);">
            <option value="all">Semua Negeri</option>
          </select>
          <select id="seat-filter-bloc" style="padding: 8px 12px; border-radius: var(--border-radius-sm); border: 1px solid var(--line); background: var(--panel); color: var(--body-text);">
            <option value="all">Semua Coaliti</option>
          </select>
          <div class="seats-summary-muted">
            <span id="seats-match-count">222 kerusi</span>
          </div>
        </div>

        <div class="table-wrap">
          <table class="seats-table" id="seats-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Kerusi</th>
                <th>Daerah</th>
                <th>Negeri</th>
                <th>Calon</th>
                <th>Coaliti</th>
                <th>Parti</th>
                <th>Projektor</th>
                <th>Margin GE15</th>
                <th class="th-flip">Bertukar?</th>
              </tr>
            </thead>
            <tbody id="seats-tbody">
              <!-- Populated by app-seats.js -->
            </tbody>
          </table>
        </div>
        <button class="load-more" id="seats-more" type="button" hidden></button>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>Hitung Kerusi 222 · Unjuran telus PRU16 · Sumber: EC · ElectionData.MY / MECo · DOSM · Parlimen</p>
    </div>
  </footer>

  <script src="/js/data.js"></script>
  <script src="/js/dun-data.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/app-seats.js"></script>
</body>
</html>
